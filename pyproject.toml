[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi_diagnostic_tool"
version = "1.0.0"
description = "A Flask WiFi dashboard for Windows — live signal diagnostics, speed testing, and experimental RF-based presence/motion detection from real netsh signal data. No cameras, no extra hardware."
readme = "README.md"
authors = [
    { name = "Abdussatar", email = "satarabdus692@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis"
]
